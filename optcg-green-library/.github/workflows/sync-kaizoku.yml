name: Synchronisation Kaizoku

# Vercel Hobby limite ses propres Cron Jobs à une fois par jour — voir
# vercel.json pour ce cron de secours quotidien. GitHub Actions, lui,
# autorise des cadences plus fines gratuitement, donc c'est lui qui assure
# le vrai rythme "toutes les 30 minutes" en appelant la même route.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {} # permet aussi un déclenchement manuel depuis l'onglet Actions

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Appeler la route de synchronisation
        run: |
          status=$(curl -s -o /tmp/response.json -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.KAIZOKU_CRON_SECRET }}" \
            "${{ secrets.KAIZOKU_APP_URL }}/api/cron/sync-kaizoku")
          echo "Statut HTTP : $status"
          cat /tmp/response.json
          if [ "$status" -ne 200 ]; then
            echo "::error::La synchronisation a échoué (statut $status)"
            exit 1
          fi
